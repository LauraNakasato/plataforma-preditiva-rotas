[tool.poetry]
name = "alert-service"
version = "0.1.0"
description = "Serviço de monitoramento hidrometeorológico e alertas de alagamento para o Grande ABC"
authors = ["Isabela Barreto <isacb5703@gmail.com>"]
readme = "README.md"
packages = [{include = "*.py"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

